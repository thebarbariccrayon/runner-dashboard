[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runner-dashboard"
version = "0.1.0"
description = "Lightweight terminal & web dashboard for self-hosted GitHub Actions runners"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "rich>=13.0",
    "psutil>=5.9",
    "python-pam>=2.0",
    "six",
]

[project.scripts]
runner-dashboard = "runner_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runner_dashboard*"]
